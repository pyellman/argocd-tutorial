apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx-rollouts
spec:
  replicas: 5
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause: {duration: 10s}
      - setWeight: 60
      - pause: {duration: 20s}
      - setWeight: 80
      - pause: {duration: 1m}
  selector:
    matchLabels:
      app: nginx-rollouts
  template:
    metadata:
      labels:
        app: nginx-rollouts
    spec:
      containers:
      - name: nginx-rollouts
        # image: kind-registry:5000/nginx:f1375706-3510-4fbe-af08-e30662f69894
        # my local docker kind-registry at kind-registry:5000 is aliased to localhost:5001 in the kind cluster containerd config
        image: kind-registry:5000/nginx:f1375706-3510-4fbe-af08-e30662f69894
        # image: kind-registry:5000/nginx:f1375706-3510-4fbe-af08-e30662f69894
        ports:
        - containerPort: 80
        # hello app is on 8080
        # - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  ports:
  - port: 8080
    targetPort: 80
    # targetPort: 8080
  selector:
    app: nginx-rollouts
